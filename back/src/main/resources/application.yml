server:
  # Render가 PORT 환경변수를 넣어줌 (HTTPS는 Render가 앞단에서 처리하므로 SSL 설정 불필요)
  port: ${PORT:8080}
  forward-headers-strategy: framework

emergency:
  api:
    key: ${EMERGENCY_API_KEY:}

kakao:
  rest:
    key: ${KAKAO_REST_KEY:}
    secret: ${KAKAO_REST_SECRET:}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:}
    secret: ${GOOGLE_CLIENT_SECRET:}

spring:
  profiles:
    active: local
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    # Supabase Session pooler 주소 (Render는 IPv6 미지원이라 Direct connection 대신 pooler 사용)
    # 예: jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000        # 액세스 토큰 만료시간 1시간 (ms)
  refresh-expiration: 2592000000  # 리프레시 토큰 만료시간 30일 (ms)
