# Render 무료 플랜은 15분간 요청이 없으면 잠들기 때문에 10분마다 깨워둔다
name: keep-render-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 https://fivemin-api.onrender.com/api/symptoms || true
